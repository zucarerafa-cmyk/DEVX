<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEON - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login">
        <h2>Seja bem-vindo à CEON</h2>
        <p class="subtitulo">Selecione uma opção e faça login</p>

        <form>
            <div class="input-group">
                <label for="cargo">Cargo</label>
                <select id="cargo" class="campo-input">
                    <option value="">Selecione um cargo...</option>
                    <option value="aluno">Aluno</option>
                    <option value="professor">Professor</option>
                    <option value="administrador">Administrador</option>
                </select>
            </div>

            <div class="input-group">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" class="campo-input" placeholder="Digite seu usuário">
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" class="campo-input" placeholder="Digite sua senha">
            </div>

            <button type="submit" class="btn-entrar">Entrar</button>
        </form>

        <div class="rodape-card">
            <span>Não tem conta?</span>
            <a href="cadastrar.php" class="link-cadastrar">Cadastrar-se</a>
        </div>
    </div>

</body>
</html>
